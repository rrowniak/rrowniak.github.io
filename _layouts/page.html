---
layout: default
---
<div class="page-shell">
  <div class="container">
    <article class="page">
      {%- if page.title %}
      <header class="page-header">
        <h1>{{ page.title | escape }}</h1>
        {%- if page.subtitle %}<p class="lead text-muted">{{ page.subtitle | escape }}</p>{%- endif %}
      </header>
      {%- endif %}
      {{ content }}
    </article>
  </div>
</div>
