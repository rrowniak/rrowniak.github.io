title: Underground Engineering
tagline: Enterprise AI, cybersecurity and distributed architectures
description: >-
  Consulting and training in enterprise AI adoption, AI-driven cybersecurity and
  distributed architectures. Led by Rafał Równiak, a software architect and
  security engineer with more than 20 years of hands-on experience.
url: "https://rrowniak.github.io"
baseurl: ""
lang: en
locale: en_US
logo: /img/rrowniak.jpeg
author: Underground Engineering

twitter_username: rrowniak
github_username: rrowniak
linkedin_username: rafalrowniak

# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Flat, keyword-clean post URLs. Existing category-prefixed URLs are preserved
# through `redirect_from` in each post.
permalink: /:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Rafał Równiak
      image: /img/og-default.jpg
      locale: en_US
  - scope:
      path: ""
      type: pages
    values:
      layout: page

show_excerpts: true

kramdown:
  input: GFM
  parse_block_html: true

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
